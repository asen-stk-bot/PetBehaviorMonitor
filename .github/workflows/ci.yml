# GitHub Actions CI / Windows + Python 3.9
# 每次 push / PR 自动跑：依赖安装 + 单元测试 + 覆盖率 + 类型检查

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    env:
      # Windows runner 默认用 cp1252 读配置/源文件，会因 UTF-8 中文注释报
      # UnicodeDecodeError；强制全 UTF-8 与本地开发环境一致
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov mypy

      - name: 跑单元测试 + 覆盖率
        run: |
          pytest tests/ --cov=src/pet_monitor --cov-report=term --cov-report=xml:coverage.xml -q

      - name: 跑 mypy 类型检查
        run: |
          mypy src/pet_monitor

      - name: 上传覆盖率到 Codecov（可选）
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
