[mypy]
python_version = 3.9
ignore_missing_imports = True
warn_unused_ignores = True
no_implicit_optional = True
show_error_codes = True
plugins = numpy.typing.mypy_plugin

# UI 层依赖 PyQt5 官方 type stubs，覆盖率/完整度差，
# 团队策略：UI 层只做语法校验，不做类型严格检查；
# 核心层（core/）必须通过严格检查。
[mypy-pet_monitor.ui.*]
ignore_errors = True

# 报警/告警有运行时分支，单测覆盖优先于类型
[mypy-pet_monitor.core.alert]
ignore_errors = True

# detector 强依赖 ultralytics 官方 type stub（覆盖不全、版本漂移大），
# 实际行为已在 tests/test_features.py 验证；类型严格检查价值低于维护成本
[mypy-pet_monitor.core.detector]
ignore_errors = True
[mypy-pet_monitor.core.behavior]
ignore_errors = True
