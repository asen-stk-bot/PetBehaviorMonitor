[mypy]
python_version = 3.9
ignore_missing_imports = True
warn_unused_ignores = True
no_implicit_optional = True
show_error_codes = True
plugins = numpy.typing.mypy_plugin

# UI layer relies on PyQt5 type stubs which are incomplete.
# Policy: syntax-level checking only for UI; core layer stays strict.
[mypy-pet_monitor.ui.*]
ignore_errors = True

# alert: runtime branches covered by unit tests take priority over typing
[mypy-pet_monitor.core.alert]
ignore_errors = True

# detector/behavior: hard dependency on ultralytics stubs (incomplete,
# version drift); real behavior is verified in tests/test_features.py
[mypy-pet_monitor.core.detector]
ignore_errors = True
[mypy-pet_monitor.core.behavior]
ignore_errors = True
